name: Post Video Automatically

on:
  workflow_dispatch:
    inputs:
      video_key:
        description: "R2 key of the video to post"
        required: true
        type: string

jobs:
  post-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run video posting script
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}

          INSTAGRAM_CHANNEL_ID: ${{ secrets.INSTAGRAM_CHANNEL_ID }}
          TIKTOK_CHANNEL_ID: ${{ secrets.TIKTOK_CHANNEL_ID }}

          POST_CAPTION: ${{ secrets.POST_CAPTION }}

          # Receives the exact R2 video key from the Telegram Worker
          VIDEO_KEY: ${{ inputs.video_key }}

        run: |
          python -m scripts.post_from_r2
